<h2 mat-dialog-title>Unsaved changes</h2>
<mat-dialog-content>
  <p>You have unsaved changes. Save before leaving?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close('cancel')">Cancel</button>
  <button mat-stroked-button type="button" (click)="close('discard')">Discard</button>
  <button mat-flat-button type="button" (click)="close('save')">Save</button>
</mat-dialog-actions>
