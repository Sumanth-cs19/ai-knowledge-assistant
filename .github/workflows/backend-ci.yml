name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Docker build validation
        if: hashFiles('ai-knowledge-assistant.Api/Dockerfile') != ''
        run: docker build -f ai-knowledge-assistant.Api/Dockerfile -t ai-knowledge-assistant-api:ci .
